services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: jarvis
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:mypassword@postgres:5432/jarvis
    depends_on:
      - postgres

volumes:
  pgdata: